version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omnisift-postgres
    environment:
      POSTGRES_USER: omnisift
      POSTGRES_PASSWORD: omnisift_password
      POSTGRES_DB: omnisift
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnisift -d omnisift"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:3.67
    container_name: omnisift-seaweedfs
    command: |
      server
      -ip=seaweedfs
      -master.port=9333
      -volume.port=8080
      -filer.port=8888
      -s3.port=8333
      -dir=/data
      -s3
      -filer
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # Master
      - "8080:8080"   # Volume
      - "8888:8888"   # Filer UI
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  seaweedfs_data: